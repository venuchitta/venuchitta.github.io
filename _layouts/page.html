---
layout: default
---
<div class="page-hero">
  <div class="container">
    {% if page.tag_color %}
    <span class="page-tag" style="--tag-color: {{ page.tag_color }}">{{ page.tag }}</span>
    {% elsif page.tag %}
    <span class="page-tag">{{ page.tag }}</span>
    {% endif %}
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.subtitle %}
    <p class="page-subtitle">{{ page.subtitle }}</p>
    {% endif %}
  </div>
</div>

<div class="container page-body">
  {{ content }}
</div>
